[package]
name = "euterpe-smb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SMB client helpers for Euterpe storage"

[features]
test-hooks = []

[dependencies]
binrw = "0.15.0"
bytes = "1"
futures-util = "0.3"
smb = "0.11.2"
smb-dtyp = "0.11.2"
smb-rpc = "0.11.2"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
url = "2"

[dev-dependencies]
pretty_assertions = "1"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
