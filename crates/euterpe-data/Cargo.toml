[package]
name = "euterpe-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Welds-backed persistence boundary for Euterpe"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "2"
welds = { version = "=0.4.22", features = ["sqlite", "detect", "check", "migrations"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
doctest = false
