[package]
name = "euterpe-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Welds-backed persistence boundary for Euterpe"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite"] }
thiserror = "2"
welds = { version = "0.5", features = ["sqlite", "detect", "check", "migrations"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
doctest = false
