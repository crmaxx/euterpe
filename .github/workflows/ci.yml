name: CI

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    openapi:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: openapi/package-lock.json
            - name: Install OpenAPI dependencies
              working-directory: openapi
              run: npm ci
            - name: Lint OpenAPI
              working-directory: openapi
              run: npm run lint
            - name: Build OpenAPI docs
              working-directory: openapi
              run: npm run build

    frontend-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci
            - name: Generate frontend API types
              working-directory: frontend
              run: npm run generate:api
            - name: Lint frontend
              working-directory: frontend
              run: npm run lint

    frontend-test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci
            - name: Generate frontend API types
              working-directory: frontend
              run: npm run generate:api
            - name: Test frontend
              working-directory: frontend
              run: npm run test

    frontend-build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci
            - name: Generate frontend API types
              working-directory: frontend
              run: npm run generate:api
            - name: Build frontend
              working-directory: frontend
              run: npm run build

    rust-build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: rust-workspace
            - name: Build Rust workspace
              run: cargo build --locked --workspace --all-targets

    rust-test:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: rust-workspace
            - name: Test Rust workspace
              run: cargo test --locked --workspace

    rust-clippy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  shared-key: rust-workspace
            - name: Lint Rust workspace
              run: cargo clippy --locked --workspace --all-targets -- -D warnings
